name: Validate migrations (PR)

# The same validation the release run performs, moved to review time. A migration
# that does not apply is a failed init container and a backend that never starts,
# so it is worth knowing before the change is merged rather than when someone
# tries to publish it.

on:
  pull_request:
    paths:
      - 'sql/**'
      - 'Dockerfile'
      - '.github/workflows/validate-migrations.yml'
      - '.github/workflows/pull-request.yml'

# A new push supersedes the run in flight.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate-migrations.yml
