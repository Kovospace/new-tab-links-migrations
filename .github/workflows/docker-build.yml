name: Build & push migrations image

# Thin caller. The pipeline itself - resolve the next version, validate the
# migrations against a throwaway Postgres, build & push the image tagged with
# that version, then tag this repository - lives in
# Kovospace/kovostack-github-workflows (flyway-release.yml).
#
# The image tag is the schema version: the backend declares the version it was
# written against in its Maven property flyway.migrations.schema.version, and
# its deployment pins this image to the same value.
#
# Releasing a new schema version:
#   1. add sql/V<n>__<description>.sql
#   2. run this workflow - it publishes the next patch version and tags the repo
#   3. bump flyway.migrations.schema.version in the backend, in the commit that
#      starts depending on the new migration
#
# A minor or major bump is the one case that still needs a human: pass the exact
# version in `version` and the automatic patch bump is skipped.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the version to publish (e.g. 0.1.0). Leave empty to bump the patch number of the newest tag.'
        type: string
        required: false
      skip_validation:
        description: 'Skip validating the migrations against a throwaway Postgres. Publishes an image nothing has checked - only for when the check itself is wrong.'
        type: boolean
        required: false
        default: false

# One release at a time. Two concurrent runs would both read the same newest tag
# and both try to publish the same version.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    uses: Kovospace/kovostack-github-workflows/.github/workflows/flyway-release.yml@2.3.0
    # The release tags this repository once the image is pushed.
    permissions:
      contents: write
    with:
      image_name: new-tab-links-migrations
      version: ${{ inputs.version }}
      skip_validation: ${{ inputs.skip_validation }}
    secrets: inherit
